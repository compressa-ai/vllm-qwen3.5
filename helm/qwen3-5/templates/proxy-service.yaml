apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwen35.proxy.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "qwen35.name" . }}-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.proxy.service.type "NodePort") .Values.proxy.service.externalPort }}
      nodePort: {{ .Values.proxy.service.externalPort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "qwen35.name" . }}-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
