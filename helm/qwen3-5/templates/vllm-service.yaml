apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwen35.vllm.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "qwen35.name" . }}-vllm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.vllm.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "qwen35.name" . }}-vllm
    app.kubernetes.io/instance: {{ .Release.Name }}
